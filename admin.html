<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RTLH Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="Assets/RTLHPlainLogo.jpg"><link rel="icon" href="Assets/RTLHPlainLogo.jpg">
<title>RTLH Admin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap');
:root{--iv:#FDFAF5;--bg2:#F0EAE0;--sand:#E2D8C8;--ch:#1C1916;--wg:#8A7F74;--gold:#B8904A;--rose:#9B6B5A;--bd:#DDD5C8;--ok:#4F7A5A;--bad:#A8493E;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--iv);color:var(--ch);font-family:'DM Sans',sans-serif;touch-action:manipulation}
#top{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--iv);border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 10px) 20px 12px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:.2em;font-weight:500}
#live{font-size:11px;color:var(--wg);display:flex;align-items:center;gap:7px;padding:8px 0 8px 12px}
#live i{width:8px;height:8px;border-radius:50%;background:var(--sand)}#live.ok i{background:var(--ok);animation:p 2s infinite}#live.err i{background:var(--bad)}
@keyframes p{50%{opacity:.35}}
#main{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 76px) 18px calc(env(safe-area-inset-bottom) + 100px)}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:rgba(253,250,245,.96);border-top:1px solid var(--bd);padding:8px 8px calc(env(safe-area-inset-bottom) + 6px)}
#tabs div{flex:1;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--wg);padding:8px 0}#tabs div b{display:block;font-size:20px;font-weight:400;margin-bottom:2px}#tabs .on{color:var(--ch)}#tabs .on b{color:var(--gold)}
h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:32px;margin-bottom:14px}
h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--wg);font-weight:500;margin:26px 0 10px}
.chips,.seg{display:flex;gap:8px;margin-bottom:16px}.chips div,.seg div{flex:1;text-align:center;padding:10px 0;border:1px solid var(--bd);border-radius:20px;font-size:13px;color:var(--wg)}
.seg div{border-radius:6px}.chips .on,.seg .on{background:var(--ch);color:#fff;border-color:var(--ch)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:var(--bg2);border-radius:10px;padding:16px}.k small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--wg)}
.k b{display:block;font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;margin-top:6px}.k.w{grid-column:span 2;background:var(--ch);color:#fff}.k.w small{color:#bba98c}.k.w b{font-size:40px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.k.w .pos{color:#9fd0a9}.k.w .neg{color:#e99}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px}.bars div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bl{display:flex;gap:5px;font-size:9px;color:var(--wg);margin-top:5px}.bl span{flex:1;text-align:center}
.hb{margin-bottom:12px}.hb .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.hb .t span{color:var(--wg)}.hb .tr{height:6px;background:var(--bg2);border-radius:3px}.hb .tr i{display:block;height:100%;background:var(--ch);border-radius:3px}
.li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--bd)}.li div:first-child{min-width:0}.li b{font-weight:500;font-size:15px}.li small{display:block;color:var(--wg);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .a{font-family:'Cormorant Garamond',serif;font-size:20px;white-space:nowrap}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--wg);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:14px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--ch);outline:none;-webkit-appearance:none;appearance:none}
.btn{display:block;text-align:center;background:var(--ch);color:#fff;border-radius:6px;padding:17px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:22px}.btn:active{opacity:.8}.btn.g{background:none;color:var(--ch);border:1px solid var(--bd)}

.acts{display:flex;gap:8px;margin:4px 0 6px}.acts .btn{margin:0;flex:1;padding:14px 4px;font-size:11px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,30px);background:var(--ch);color:#fff;padding:12px 20px;border-radius:30px;font-size:14px;opacity:0;transition:all .4s var(--ease);z-index:20;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--wg);padding:40px 10px;font-size:14px;line-height:1.6}
</style></head><body>
<div id="top"><div class="logo">RTLH</div><div id="live" onclick="load(true)"><i></i><span id="lt">—</span></div></div>
<div id="main"></div>
<div id="tabs"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const PR={'The Voyage Tag':[120,'Blue,Brown,Pink,Red,White'],'The Heartpiece':[85,'Black,Blue,Brown,Green,Navy,Pink,Red'],'The Heart Mirror':[110,'Blue,Pink,Red,White'],'The Foldable Mirror':[95,'Brown,Green,Pink'],'The Necklace':[195,''],'RTLH Card Holder':[150,'Black,Burgundy,Gray,Navy'],'The Cardholder':[150,'Beige,Blue,Pink'],'MagSafe':[135,'Berry,Black,Crimson,Desert Gold,Gray,Green,Lavender,Lemon,Light Blue,Light Brown,Light Pink,Navy,Orange,Pink,Purple,Red,Rose Gold,Silver,White,Yellow'],'Gua Sha':[95,'']};
const TYPES=['Engraving','Monogram Emboss','Foil Stamp','No personalisation'],CH=['Event','Direct','Instagram','WhatsApp','Other'],CAT=['Materials','Marketing','Event fees','Equipment','Shipping','Other'];
// Admin sheet URL. Replace with your NEW Google Apps Script /exec URL if needed.
const DEF1='https://script.google.com/macros/s/AKfycby8IqyOK3DpAMI5SjI8_qmT_sDPOotzT-1l-0czE7XcNMd4edW9DHdrST-id8624tqFcw/exec';
// Leave blank while testing. Add the kiosk/event sheet /exec URL later.
const DEF2='https://script.google.com/macros/s/AKfycbxwZVXoH9BrYz1qFSavv3rl-sdJIP9RjPXo9n8XZjSYpaaLAb2ukdEhitY-Eu8bCR0C/exec';
let URL_=LS.rtlh_url||DEF1,URL2=LS.rtlh_url2||DEF2,src='all',D=JSON.parse(LS.rtlh_data||'{"orders":[],"expenses":[],"ev":[]}'),tab='ov',range=0,ls='q',sel=null,q='',edit=null,as='o',busy=false;
const AO=()=>src=='direct'?D.orders:src=='event'?(D.ev||[]):D.orders.concat(D.ev||[]);
const evRow=(r,i)=>{const m=String(r[0]).match(/^(\d\d)\/(\d\d)\/(\d{4})/),d=m?`${m[3]}-${m[2]}-${m[1]}`:/^\d{4}-\d\d-\d\d/.test(r[0])?String(r[0]).slice(0,10):null;if(!d||r[1]==='TEST')return null;const p=PR[r[4]];
 return{id:i,date:d,customer:r[3],product:r[4],color:r[5]==='N/A'?'':r[5],type:r[6],text:r[7]==='—'?'':r[7],price:0,channel:'Event: '+(r[1]||'—')}};
const PAY=['Ali','Mamad','Not split'],isSet=v=>v===true||/^(true|yes|y)$/i.test(String(v)),other=p=>p=='Ali'?'Mamad':'Ali';
function bal(){const o={Ali:0,Mamad:0};D.expenses.forEach(r=>{if((r.paidBy=='Ali'||r.paidBy=='Mamad')&&!isSet(r.settled))o[other(r.paidBy)]+=num(r.amount)/2});const n=o.Ali-o.Mamad;return n>0?`Ali owes Mamad ${AED(n)}`:n<0?`Mamad owes Ali ${AED(-n)}`:''}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AED=n=>(n<0?'-':'')+'AED '+Math.round(Math.abs(n)).toLocaleString('en-US');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'});
const day=s=>String(s).slice(0,10),num=v=>parseFloat(v)||0;
const cut=()=>{if(!range)return'';const d=new Date();d.setDate(d.getDate()-range);return d.toLocaleDateString('en-CA')};
const inR=r=>day(r.date)>=cut();
async function apiPost(payload){
  if(!URL_)throw new Error('No Admin sheet URL configured');

  const res=await fetch(URL_,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    redirect:'follow'
  });

  const text=await res.text();

  if(!res.ok)throw new Error('Admin sheet HTTP '+res.status);

  if(String(text).trim()==='OK')return {ok:true};

  try{
    const j=JSON.parse(text);
    if(j.ok===false)throw new Error(j.error||'Apps Script error');
    return j;
  }catch(err){
    console.error('POST response:',text);
    throw new Error('Invalid response from Admin sheet');
  }
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function setLive(c,t){$('#live').className=c;$('#lt').textContent=t}
async function load(manual){
  if(!URL_&&!URL2){
    setLive('err','Not connected');
    return render();
  }

  if(busy)return;
  busy=true;
  setLive('','Syncing…');

  try{
    if(URL_){
      const res=await fetch(URL_,{method:'GET',cache:'no-store',redirect:'follow'});
      const text=await res.text();

      if(!res.ok) throw new Error('Admin sheet HTTP '+res.status);

      let j;
      try{j=JSON.parse(text)}
      catch(err){
        console.error('Admin sheet returned:',text);
        throw new Error('Admin sheet did not return JSON');
      }

      if(j.ok===false) throw new Error(j.error||'Admin Apps Script error');

      D.orders=j.orders||[];
      D.expenses=j.expenses||[];
    }

    if(URL2){
      const res=await fetch(URL2,{method:'GET',cache:'no-store',redirect:'follow'});
      const text=await res.text();

      if(!res.ok) throw new Error('Event sheet HTTP '+res.status);

      let v;
      try{v=JSON.parse(text)}
      catch(err){
        console.error('Event sheet returned:',text);
        throw new Error('Event sheet did not return JSON');
      }

      D.ev=v.map(evRow).filter(Boolean);
    }else{
      D.ev=[];
    }

    LS.rtlh_data=JSON.stringify(D);

    setLive('ok','Live · '+new Date().toLocaleTimeString('en-GB',{
      hour:'2-digit',
      minute:'2-digit'
    }));

    if(manual)toast('Updated');

    if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render();

  }catch(e){
    console.error('RTLH Sheets connection error:',e);
    setLive('err','Offline · cached');

    if(manual)toast('Could not reach sheet: '+(e.message||'Connection failed'));
  }finally{
    busy=false;
  }
}

function tally(rows,key){const m={};rows.forEach(r=>{const k=r[key]||'—';if(k==='—'||k==='N/A')return;m[k]=m[k]||{n:0,rev:0};m[k].n++;m[k].rev+=num(r.price)});return Object.entries(m).sort((a,b)=>b[1].n-a[1].n||b[1].rev-a[1].rev)}
function hbars(list,max=5){if(!list.length)return'<div class="empty" style="padding:14px">No data yet</div>';const top=list[0][1].n;
 return list.slice(0,max).map(([k,v])=>`<div class="hb"><div class="t">${esc(k)}<span>${v.n} · ${AED(v.rev)}</span></div><div class="tr"><i style="width:${v.n/top*100}%"></i></div></div>`).join('')}
function ov(){const o=AO().filter(inR),e=D.expenses.filter(inR),rev=o.reduce((a,r)=>a+num(r.price),0),sp=e.reduce((a,r)=>a+num(r.amount),0),pf=rev-sp;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toLocaleDateString('en-CA')}),dv=days.map(d=>AO().filter(r=>day(r.date)==d).reduce((a,r)=>a+num(r.price),0)),mx=Math.max(...dv,1);
 const ec={};e.forEach(r=>ec[r.category]=(ec[r.category]||0)+num(r.amount));
 const best=tally(o,'product')[0],bc=tally(o,'color')[0];
 return`<h2>Overview</h2>${bal()?`<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between" onclick="tab='ord';ls='e';render()"><span>${bal()}</span><b style="color:var(--gold)">View →</b></div>`:''}${D.orders.some(r=>!r.done)?`<div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between" onclick="tab='ord';ls='q';render()"><span>${D.orders.filter(r=>!r.done).length} to fulfill</span><b style="color:var(--gold)">View →</b></div>`:''}<div class="chips">${[[7,'7D'],[30,'30D'],[90,'90D'],[0,'All']].map(([v,l])=>`<div class="${range==v?'on':''}" onclick="range=${v};render()">${l}</div>`).join('')}</div>
<div class="chips">${[['all','All sales'],['direct','Individual'],['event','Events']].map(([v,l])=>`<div class="${src==v?'on':''}" onclick="src='${v}';render()">${l}</div>`).join('')}</div>
<div class="kp"><div class="k w"><small>Profit</small><b class="${pf>=0?'pos':'neg'}">${AED(pf)}</b></div>
<div class="k"><small>Revenue</small><b>${AED(rev)}</b></div><div class="k"><small>Spent</small><b>${AED(sp)}</b></div>
<div class="k"><small>Orders</small><b>${o.length}</b></div><div class="k"><small>Avg order</small><b>${AED(o.filter(r=>num(r.price)>0).length?rev/o.filter(r=>num(r.price)>0).length:0)}</b></div>
<div class="k"><small>Best seller</small><b style="font-size:20px">${best?esc(best[0]):'—'}</b></div><div class="k" onclick="tab='ord';ls='q';render()"><small>To fulfill</small><b style="color:${D.orders.some(r=>!r.done)?'var(--gold)':'var(--ok)'}">${D.orders.filter(r=>!r.done).length||'All done ✓'}</b></div></div>
<h3>Revenue · last 14 days</h3><div class="card"><div class="bars">${dv.map(v=>`<div style="height:${v/mx*100}%"></div>`).join('')}</div><div class="bl">${days.map(d=>`<span>${d.slice(8)}</span>`).join('')}</div></div>
<h3>Top products</h3><div class="card">${hbars(tally(o,'product'),6)}</div><h3>Top colours</h3><div class="card">${hbars(tally(o,'color'))}</div>
<h3>Personalisation</h3><div class="card">${hbars(tally(o,'type'))}</div><h3>Events</h3><div class="card">${hbars(tally(o,'channel'))}</div>
<h3>Spending by category</h3><div class="card">${Object.keys(ec).length?Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hb"><div class="t">${esc(k)}<span>${AED(v)}</span></div><div class="tr"><i style="width:${v/sp*100}%"></i></div></div>`).join(''):'<div class="empty" style="padding:14px">No expenses yet</div>'}</div>`}
function ord(){const P=D.orders.filter(r=>!r.done);
 const seg=`<div class="seg">${[['q','To do ('+P.length+')'],['d','Done'],['v','Events'],['e','Expenses']].map(([k,l])=>`<div class="${ls==k?'on':''}" style="font-size:12px" onclick="ls='${k}';sel=null;render()">${l}</div>`).join('')}</div>`;
 return`<h2>${{q:'To do',d:'Fulfilled',v:'Event orders',e:'Expenses'}[ls]}</h2>${seg}${ls=='e'&&bal()?`<div class="card" style="margin-bottom:12px"><b>${bal()}</b></div>`:''}<input id="sq" type="search" placeholder="Search name, product, text…" value="${esc(q)}" oninput="q=this.value;lst()" style="margin-bottom:6px"><div id="lst">${lstHtml()}</div>`}
function lst(){$('#lst').innerHTML=lstHtml()}
function lstHtml(){const P=D.orders.filter(r=>!r.done),F=D.orders.filter(r=>r.done),t=q.trim().toLowerCase();
 const srt=(a,asc)=>a.slice().sort((x,y)=>(asc?1:-1)*(day(x.date).localeCompare(day(y.date))||num(x.id)-num(y.id)));
 let L=ls=='q'?srt(P,1):ls=='d'?srt(F,0):ls=='v'?srt(D.ev||[],0):srt(D.expenses,0);
 if(t)L=L.filter(r=>Object.values(r).join(' ').toLowerCase().includes(t));L=L.slice(0,200);
 const kd=ls=='e'?'expense':'order';
 const acts=r=>sel==r.id?`<div class="acts">${ls=='q'?`<div class="btn" style="background:var(--ok)" onclick="mark(${r.id},true)">Fulfilled ✓</div>`:ls=='d'?`<div class="btn" onclick="mark(${r.id},false)">Re-open</div>`:''}${settleBtn(r)}<div class="btn g" onclick="startEdit('${kd}',${r.id})">Edit</div><div class="btn g" style="color:var(--bad)" onclick="del('${kd}',${r.id})">Delete</div></div>`:'';
 const settleBtn=r=>ls=='e'&&r.paidBy?`<div class="btn" style="${isSet(r.settled)?'':'background:var(--ok)'}" onclick="settle(${r.id},${!isSet(r.settled)})">${isSet(r.settled)?'Un-settle':'Settled ✓'}</div>`:'';
 const share=r=>r.paidBy?`<small style="color:${isSet(r.settled)?'var(--ok)':'var(--gold)'}">${esc(r.paidBy)} paid · ${esc(other(r.paidBy))} owes ${AED(num(r.amount)/2)} · ${isSet(r.settled)?'Settled ✓':'Pending'}</small>`:'';
 const tap=r=>`onclick="sel=sel==${r.id}?null:${r.id};lst()"`;
 const row=r=>ls=='e'?`<div class="li" ${tap(r)}><div><b>${esc(r.category)}</b><small>${esc(r.description)} · ${day(r.date)}</small>${share(r)}</div><div class="a neg">${AED(num(r.amount))}</div></div>${acts(r)}`
  :`<div class="li" ${ls=='v'?'':tap(r)}><div><b>${esc(r.product)}${r.color?' · '+esc(r.color):''}</b><small>${esc(r.customer)} · ${day(r.date)}${r.est?' · est.':''}</small><small>${esc(r.type)}${r.text?': '+esc(r.text):''}${r.notes?' · '+esc(r.notes):''}</small></div><div class="a">${AED(num(r.price))}</div></div>${ls=='v'?'':acts(r)}`;
 return L.length?L.map(row).join(''):`<div class="empty">${t?'No matches.':ls=='q'?'All caught up ✓':'Nothing here yet.'}</div>`}
function startEdit(kind,id){const rec=(kind=='order'?D.orders:D.expenses).find(x=>String(x.id)==String(id));if(!rec)return;edit={kind,id,rec:{...rec}};as=kind=='order'?'o':'e';tab='add';render();$('#main').scrollTop=0}
async function del(kind,id){if(!confirm('Delete this entry? This cannot be undone.'))return;const k=kind=='order'?'orders':'expenses';D[k]=D[k].filter(x=>String(x.id)!=String(id));sel=null;LS.rtlh_data=JSON.stringify(D);render();
 try{await apiPost({action:'delete_'+kind,id});toast('Deleted')}catch(e){toast('Could not reach the sheet: '+e.message)}
 setTimeout(()=>load(),2500)}
async function mark(id,fulfil){const r=D.orders.find(x=>String(x.id)==String(id));if(!r)return;r.done=fulfil;sel=null;LS.rtlh_data=JSON.stringify(D);render();
 try{await apiPost({action:fulfil?'fulfill':'reopen',id});toast(fulfil?'Fulfilled ✓':'Moved back to queue')}catch(e){toast('Could not reach the sheet: '+e.message)}
 setTimeout(()=>load(),2500)}
async function settle(id,v){const r=D.expenses.find(x=>String(x.id)==String(id));if(!r)return;r.settled=v;sel=null;LS.rtlh_data=JSON.stringify(D);render();
 try{await apiPost({action:v?'settle':'unsettle',id});toast(v?'Settled ✓':'Marked pending')}catch(e){toast('Could not reach the sheet: '+e.message)}
 setTimeout(()=>load(),2500)}
const opt=a=>a.map(x=>`<option>${x}</option>`).join(''),optS=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
function add(){const E=edit?edit.rec:null,v=k=>esc(E&&E[k]!=null?E[k]:''),dt=E?day(E.date):today();
 const seg=E?'':`<div class="seg"><div class="${as=='o'?'on':''}" onclick="as='o';render()">New order</div><div class="${as=='e'?'on':''}" onclick="as='e';render()">New expense</div></div>`;
 const ttl=E?(as=='o'?'Edit order':'Edit expense'):'Add';
 const fin=k=>`<div class="btn" onclick="submit('${k}')">${E?'Save changes':'Save '+k}</div>${E?'<div class="btn g" onclick="edit=null;tab=\'ord\';render()">Cancel</div>':''}`;
 if(as=='o')return`<h2>${ttl}</h2>${seg}<label>Date</label><input id="f_date" type="date" value="${dt}"><label>Customer</label><input id="f_customer" placeholder="Name" value="${v('customer')}"><label>Product</label><select id="f_product" onchange="prod()"><option value="">Select…</option>${optS(Object.keys(PR),E&&E.product)}</select>
<label>Colour</label><input id="f_color" list="cl" placeholder="Colour" value="${v('color')}"><datalist id="cl"></datalist><label>Personalisation</label><select id="f_type">${optS(TYPES,E&&E.type)}</select><label>Text</label><input id="f_text" placeholder="Engraved text (optional)" value="${v('text')}">
<label>Price (AED)</label><input id="f_price" type="number" inputmode="decimal" placeholder="0" value="${v('price')}"><label>Notes</label><input id="f_notes" placeholder="Optional" value="${v('notes')}">${fin('order')}`;
 return`<h2>${ttl}</h2>${seg}<label>Date</label><input id="f_date" type="date" value="${dt}"><label>Category</label><select id="f_category">${optS(CAT,E&&E.category)}</select><label>Description</label><input id="f_description" placeholder="e.g. Leather batch" value="${v('description')}"><label>Amount (AED)</label><input id="f_amount" type="number" inputmode="decimal" placeholder="0" value="${v('amount')}"><label>Paid by</label><select id="f_paidBy"><option value="">Select…</option>${optS(PAY,E?(E.paidBy||'Not split'):'')}</select>${fin('expense')}`}
function fillCl(){const p=PR[($('#f_product')||{}).value];if($('#cl'))$('#cl').innerHTML=p&&p[1]?p[1].split(',').map(c=>`<option>${c}</option>`).join(''):''}
function prod(){const p=PR[$('#f_product').value];if(!p)return;$('#f_price').value=p[0];$('#cl').innerHTML=p[1]?p[1].split(',').map(c=>`<option>${c}</option>`).join(''):'';$('#f_color').value=''}
async function submit(kind){const g=id=>($('#f_'+id)||{}).value||'';let d;
 if(kind=='order'){if(!g('product')||!num(g('price')))return toast('Product and price needed');d={action:'order',date:g('date'),customer:g('customer'),product:g('product'),color:g('color'),type:g('type'),text:g('text'),price:num(g('price')),notes:g('notes')}}
 else{if(!num(g('amount')))return toast('Amount needed');if(!g('paidBy'))return toast('Who paid?');d={action:'expense',date:g('date'),category:g('category'),description:g('description'),amount:num(g('amount')),paidBy:g('paidBy')=='Not split'?'':g('paidBy'),settled:edit&&edit.rec.settled?isSet(edit.rec.settled):false}}
 if(!URL_)return toast('Connect your sheet in Settings');
 const arr=kind=='order'?D.orders:D.expenses;
 if(edit){d.id=edit.id;d.action=kind=='order'?'update_order':'update_expense';const rc=arr.find(x=>String(x.id)==String(edit.id));if(rc)Object.assign(rc,{...d,action:undefined})}else{d.id=Date.now();arr.push(d)}
 LS.rtlh_data=JSON.stringify(D);
 try{await apiPost(d);toast('Saved ✓')}catch(e){toast('Saved locally — send failed: '+e.message)}
 tab='ord';ls=kind=='order'?(edit&&edit.rec.done?'d':'q'):'e';edit=null;render();setTimeout(()=>load(),2500)}
function set(){return`<h2>Settings</h2><label>Sales sheet URL (individual sales, expenses)</label><input id="url" value="${esc(URL_)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"><label>Event sheet URL (kiosk orders)</label><input id="url2" value="${esc(URL2)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"><div class="btn" onclick="saveUrl()">Save &amp; connect</div><div class="btn g" onclick="load(true)">Refresh now</div>
<div class="empty" style="text-align:left">Use a <b>new</b> Google Sheet for this app, not the event sheet. Event orders come from the kiosk's sheet; their prices are estimated from the price list since the kiosk doesn't record prices.<br><br>The event sheet URL can be left blank while testing. Data refreshes every 30 seconds while the app is open.</div>`}
function saveUrl(){URL_=$('#url').value.trim();LS.rtlh_url=URL_;URL2=$('#url2').value.trim();LS.rtlh_url2=URL2;toast('Saved');load(true)}
const TABS=[['ov','◈','Stats'],['ord','☰','Orders'],['add','+','Add'],['set','⚙','Settings']],V={ov,ord,add,set};
function render(){const m=$('#main'),sc=m.scrollTop;m.innerHTML=V[tab]();if(tab=='add')fillCl();m.scrollTop=sc;
 $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<div class="${tab==k?'on':''}" onclick="edit=null;tab='${k}';render();$('#main').scrollTop=0"><b>${i}</b>${l}</div>`).join('')}
render();load();setInterval(()=>{if(!document.hidden)load()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
</script></body></html>
