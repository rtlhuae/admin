<div class="pre">${PRESETS.map(x=>`<div class="${v==x?'on':''}" onclick="setC(${A(k)},${x})">${x}</div>`).join('')}</div></div>`}
function cartBar(mode){const n=Object.values(cart).reduce((a,v)=>a+v,0),amt=Object.entries(cart).reduce((a,[k,v])=>a+priceOf(k.split('|')[0])*v,0);
 return`<div class="cart">${mode=='qo'?`<div id="csum">${n} piece${n>1?'s':''} · ${AED(amt)}<small><span onclick="event.stopPropagation();addOrders=!addOrders;render()">${addOrders?'☑':'☐'} Also add to orders</span></small></div>`:`<div id="csum">${n} piece${n>1?'s':''}<small>${rsMode=='now'?'Add to stock now':'Mark as incoming'}</small></div>`}<div class="btn g" style="background:none;color:#fff;border-color:#4a443d" onclick="cart={};stAct=null;render()">Clear</div><div class="btn" onclick="${mode=='qo'?'confirmQo()':'confirmRs()'}">Confirm</div></div>`}
function setC(k,v,typing){v=Math.max(0,Math.round(num(v)));if(v)cart[k]=v;else delete cart[k];
 if(typing){const b=document.querySelector(`.n[data-k="${CSS.escape(k)}"]`);if(b)b.textContent=(stv=='rs'?'+':'')+v;const s=$('#csum');if(s){const n=Object.values(cart).reduce((a,x)=>a+x,0);s.firstChild.textContent=stv=='qo'?`${n} piece${n>1?'s':''} · ${AED(Object.entries(cart).reduce((a,[kk,x])=>a+priceOf(kk.split('|')[0])*x,0))}`:`${n} piece${n>1?'s':''}`}document.querySelectorAll('.pre div').forEach(d=>d.classList.toggle('on',d.textContent==String(v)));return}
 const sc=$('#main').scrollTop;render();$('#main').scrollTop=sc}
function tapC(k){stAct=k;cart[k]=(cart[k]||0)+1;const sc=$('#main').scrollTop;render();$('#main').scrollTop=sc}
async function confirmQo(){const items=Object.entries(cart),m=stockMap(),short=items.filter(([k,v])=>{const r=m[k];return(r?num(r.physical)-num(r.reserved):0)<v});
 if(short.length&&!confirm('Some colours don\'t have enough free stock. Continue anyway?'))return;
 let cust='';if(addOrders){cust=prompt('Customer name (optional)','')||'';}
 const id=String(Date.now()),moves=items.map(([k,v])=>{const[p,c]=k.split('|');return{kind:'sale',product:p,color:c,qty:v,note:cust||'Quick order',ref:id,sub:'q'+id+k}});
 cart={};stSel=null;stAct=null;render();
 const j=await post({action:'stock_moves',moves,by:ME},'Stock updated ✓');if(j&&j.stock){D.stock=j.stock;save();render()}
 if(addOrders){const rows=moves.map((mv,i)=>({id:String(num(id)+i),date:today(),customer:cust,product:mv.product,color:mv.color,type:'Engraving',text:'',qty:mv.qty,price:priceOf(mv.product)*mv.qty,channel:'Direct',kind:moves.length>1?'multi':'',ref:moves.length>1?'o'+id:'',notes:'Quick order'}));D.orders.push(...rows);save();post(rows.length>1?{action:'orders',rows}:{action:'order',...rows[0]})}}
async function confirmRs(){const id=String(Date.now()),moves=Object.entries(cart).map(([k,v])=>{const[p,c]=k.split('|');return{kind:rsMode=='now'?'restock':'incoming',product:p,color:c,qty:v,sub:'r'+id+k}});
 cart={};stSel=null;stAct=null;render();const j=await post({action:'stock_moves',moves,by:ME},rsMode=='now'?'Restocked ✓':'Marked incoming ✓');if(j&&j.stock){D.stock=j.stock;save();render()}}
function stIn(){const I=stockItems().filter(i=>i.inc>0);if(!I.length)return`<div class="empty">Nothing on the way. Use Restock → “On the way” when you order more.</div>`;
 return I.map(i=>`<div class="sp"><img src="${cimg(i)}"><div><b>${esc(i.p.name)}</b><small>${esc(i.c.name)} · ${i.inc} on the way</small></div></div><div class="acts"><div class="btn ok" onclick="mv1('receive',${A(i.p.name)},${A(i.c.name)},${i.inc})">Received all ${i.inc}</div><div class="btn g" onclick="mvAsk('receive',${A(i.p.name)},${A(i.c.name)},'How many arrived?')">Some arrived</div><div class="btn g" style="color:var(--bad)" onclick="mv1('cancel_incoming',${A(i.p.name)},${A(i.c.name)},${i.inc})">Cancel</div></div>`).join('')}
function stHist(){const t=q.trim().toLowerCase(),K={all:null,s:/sale/,r:/restock|receive|opening/,i:/incoming/,a:/adjust|count|reserve|release/};
 const L=D.moves.slice().reverse().filter(m=>(!K[hk]||K[hk].test(m.kind))&&(!t||JSON.stringify(m).toLowerCase().includes(t)));
 return`<div class="chips">${[['all','All'],['s','Sales'],['r','Restock'],['i','Incoming'],['a','Adjust']].map(([k,l])=>`<div class="${hk==k?'on':''}" onclick="hk='${k}';render()">${l}</div>`).join('')}</div><input type="search" placeholder="Search" value="${esc(q)}" onchange="q=this.value;render()"><div>${L.slice(0,200).map(mvRow).join('')||'<div class="empty">No history yet.</div>'}</div><div class="btn g" onclick="exportMoves()">Export history CSV</div><div class="note">Shows the last 400 changes. The full history is in the “Moves” tab of your Google Sheet.</div>`}
function stSheet(p,c){const i=stockItems().find(x=>x.p.name==p&&x.c.name==c);if(!i)return;
 $('#sheetc').innerHTML=`<div class="sp" style="border:0;padding-top:0"><img src="${cimg(i)}"><div><b>${esc(p)}</b><small>${esc(c)}</small></div></div>
<div class="kp k4" style="grid-template-columns:repeat(3,1fr)"><div class="k"><small>Physical</small><b>${i.phys}</b></div><div class="k"><small>Free</small><b>${free(i)}</b></div><div class="k"><small>Incoming</small><b>${i.inc}</b></div></div>
${i.res?`<div class="note">${i.res} reserved for events.</div>`:''}
<label>Add or remove</label><div class="row2"><div class="step"><div onclick="const f=$('#adjq');f.value=num(f.value)-1">−</div><input id="adjq" type="number" inputmode="numeric" value="0"><div onclick="const f=$('#adjq');f.value=num(f.value)+1">+</div></div><select id="adjr">${['Count correction','Damaged','Sample / gift','Lost','Returned','Found','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div>
<div class="btn" onclick="sheetAdj(${A(p)},${A(c)})">Save change</div>
<div class="acts" style="margin-top:12px"><div class="btn g" onclick="closeSheet();mvAsk('count',${A(p)},${A(c)},'Exact number you have now?')">Set exact count</div><div class="btn g" onclick="closeSheet();mvAsk('reserve',${A(p)},${A(c)},'How many to reserve for an event?')">Reserve</div>${i.res?`<div class="btn g" onclick="closeSheet();mv1('release',${A(p)},${A(c)},${i.res})">Release ${i.res}</div>`:''}<div class="btn g" onclick="closeSheet();setLow(${A(p)},${A(c)},${limOf(i)})">Alert at ${limOf(i)}</div></div>
<div class="btn g" onclick="closeSheet()">Close</div>`;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
async function sheetAdj(p,c){const n=Math.round(num($('#adjq').value));if(!n)return toast('Enter how many');closeSheet();mv1('adjust',p,c,n,$('#adjr').value)}
function mvAsk(kind,p,c,msg){const v=prompt(msg,'');if(v==null||v==='')return;const n=Math.round(num(v));if(kind!='count'&&n<=0)return;mv1(kind,p,c,n)}
async function mv1(kind,p,c,n,note){const j=await post({action:'stock_moves',moves:[{kind,product:p,color:c,qty:n,note:note||'',sub:kind+Date.now()}],by:ME},'Saved ✓');if(j&&j.stock){D.stock=j.stock;save();render()}}
async function setLow(p,c,cur){const v=prompt('Alert me when free stock is at or below:',cur);if(v==null)return;post({action:'stock_low',product:p,color:c,low:Math.round(num(v))},'Saved ✓')}
async function seedStock(b){if(!confirm('Load '+SEED.length+' items from your 22 Nov count?'))return;b.textContent='Loading…';const j=await post({action:'stock_seed',rows:SEED,by:ME},'Opening stock loaded ✓');if(j&&j.stock){D.stock=j.stock;save();render()}}
function csv(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}
function download(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/csv'}),file=new File([blob],name,{type:'text/csv'});
 if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file]}).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function exportStock(){download('rtlh-stock-'+today()+'.csv',csv([['product','colour','physical','reserved','free','incoming','alert at']].concat(stockItems().filter(i=>i.r).map(i=>[i.p.name,i.c.name,i.phys,i.res,free(i),i.inc,limOf(i)]))))}
function exportMoves(){download('rtlh-stock-history-'+today()+'.csv',csv([['time','change','product','colour','qty','physical after','incoming after','note','by']].concat(D.moves.map(m=>[m.time,MVK[m.kind]||m.kind,m.product,m.color,m.qty,m.physical,m.incoming,m.note,m.by]))))}
// ============================================================ SETTINGS
function set(){const s=S(),f=(k,l,t)=>`<label>${l}</label><input id="s_${k}" ${t||''} value="${esc(s[k])}">`;
 return`<h2>Settings</h2><label>Who is using this phone</label><div class="seg">${['Ali','Mamad'].map(n=>`<div class="${ME==n?'on':''}" onclick="ME='${n}';LS.rtlh_me=ME;render()">${n}</div>`).join('')}</div>
<label>Sales sheet URL (orders, expenses, events, stock)</label><input id="url" value="${esc(URL_)}" autocapitalize="off" autocorrect="off"><label>Event sheet URL (kiosk orders)</label><input id="url2" value="${esc(URL2)}" autocapitalize="off" autocorrect="off"><div class="btn" onclick="saveUrl()">Save &amp; connect</div>
<h3>Quotations &amp; invoices</h3>${needV2()}${f('bizName','Business name')}${f('licence','DED trade licence no.')}${f('phone','Phone','inputmode="tel"')}${f('email','Email','type="email" autocapitalize="off"')}${f('address','Address')}${f('web','Website','autocapitalize="off"')}
<label>Payment terms</label><textarea id="s_payment" rows="3">${esc(s.payment)}</textarea>${f('thanks','Footer line')}${f('quoteDays','Quotation valid for (days)','type="number" inputmode="numeric"')}
<h3>Booth transportation</h3><div class="row2"><div>${f('transportNear','Dubai &amp; Sharjah','type="number" inputmode="numeric"')}</div><div>${f('transportFar','Rest of UAE','type="number" inputmode="numeric"')}</div></div>
<h3>Stock</h3>${f('lowDefault','Low-stock alert at (pieces per colour)','type="number" inputmode="numeric"')}
<div class="btn" onclick="saveSettings()">Save settings</div><div class="btn g" onclick="load(true)">Refresh now</div>
<div class="note" style="margin-top:16px">Products, prices and photos come from rtlh.art. To change them, edit the website's products file and they update here and on the kiosk.</div>`}
function saveUrl(){const _dk=vkey();URL_=$('#url').value.trim();LS.rtlh_url=URL_;URL2=$('#url2').value.trim();LS.rtlh_url2=URL2;clearDraft(_dk);toast('Saved');load(true)}
async function saveSettings(){const _dk=vkey();const o={};Object.keys(DEFSET).forEach(k=>{const e=$('#s_'+k);if(e)o[k]=e.value});clearDraft(_dk);D.settings=Object.assign({},D.settings,o);save();
 if(!V2())return toast('Saved on this phone — update the sheet code to share with your partner');const j=await post({action:'settings_save',settings:o},'Settings saved ✓');if(j&&j.settings){D.settings=j.settings;save()}}
// ============================================================ shell
const TABS=[['ov','◈','Stats'],['ord','☰','Orders'],['add','+','Add'],['st','▦','Stock'],['set','⚙','Settings']],VW={ov,ord,add,st,set};
function render(){const m=$('#main'),sc=m.scrollTop;m.innerHTML=VW[tab]();restoreDraft();saveUI();m.scrollTop=sc;const al=V2()?stockAlerts().filter(a=>a.free<=0).length:0;
 $('#tabs').innerHTML=TABS.map(([k,i,l])=>`<div class="${tab==k?'on':''}" onclick="openEv=(tab=='${k}'?null:openEv);tab='${k}';q='';render();$('#main').scrollTop=0"><b>${i}</b>${l}${k=='st'&&al?`<sup>${al}</sup>`:''}</div>`).join('')}
window.addEventListener('resize',()=>{if($('#doc').classList.contains('on'))fitDoc()});
render();load();setInterval(()=>{if(!document.hidden&&!$('#sheet').classList.contains('on')&&!(tab=='add')&&!(tab=='ord'&&openEv)&&!Object.keys(cart).length)load()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});flushOutbox();
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
</script></body></html>
